<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Розклад приміських поїздів</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #12181f;
    --panel: #1b232d;
    --panel-border: #2a3644;
    --text: #ece8dd;
    --text-muted: #8a93a0;
    --amber: #f2a93b;
    --amber-dim: #4a3a1c;
    --blue: #4d8fd6;
    --yellow: #f2c94c;
    --divider: #29323d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 3rem;
  }

  .flag-rule {
    height: 3px;
    background: linear-gradient(90deg, var(--blue) 50%, var(--yellow) 50%);
  }

  header {
    padding: 1.75rem 1.25rem 1.25rem;
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 0.35rem;
    letter-spacing: -0.01em;
  }

  .meta {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-family: 'IBM Plex Mono', monospace;
  }

  .day-toggle {
    display: flex;
    gap: 0.5rem;
    margin-top: 1.1rem;
  }

  .day-toggle button {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.55rem;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .day-toggle button.active {
    color: var(--amber);
    border-color: var(--amber);
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .station {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
  }

  .station-head {
    padding: 0.9rem 1.1rem 0.7rem;
    border-bottom: 1px solid var(--divider);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .station-head h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0;
  }

  .station-head .note {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .direction-group + .direction-group {
    border-top: 1px solid var(--panel-border);
  }

  .direction-label {
    padding: 0.5rem 1.1rem 0.35rem;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--blue);
    background: rgba(77, 143, 214, 0.08);
  }

  .row {
    display: grid;
    grid-template-columns: 4.2rem 1fr;
    gap: 0.75rem;
    align-items: center;
    padding: 0.6rem 1.1rem;
    border-bottom: 1px solid var(--divider);
  }

  .row:last-child { border-bottom: none; }

  .row.next {
    background: linear-gradient(90deg, var(--amber-dim), transparent 70%);
  }

  .row .time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.05rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .row.next .time { color: var(--amber); }

  .row .route {
    font-size: 0.9rem;
    line-height: 1.25;
  }

  .row .route .num {
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    margin-right: 0.4rem;
  }

  .row .kind {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap;
  }

  .empty {
    padding: 1.4rem 1.1rem;
    color: var(--text-muted);
    font-size: 0.88rem;
  }

  .loading, .error {
    max-width: 720px;
    margin: 3rem auto;
    padding: 0 1.25rem;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="flag-rule"></div>
<header>
  <h1>Розклад приміських поїздів</h1>
  <div class="meta" id="generatedMeta">Завантаження…</div>
  <div class="day-toggle" id="dayToggle"></div>
</header>

<main id="app">
  <div class="loading">Завантажую дані…</div>
</main>

<script>
const DATA_URL = 'data/schedule.json';
let scheduleData = null;
let activeDayIndex = 0;

function parseTime(t) {
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function formatGeneratedAt(iso) {
  const d = new Date(iso);
  return 'Оновлено ' + d.toLocaleString('uk-UA', {
    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
  });
}

function renderDayToggle() {
  const toggle = document.getElementById('dayToggle');
  toggle.innerHTML = '';
  scheduleData.days.forEach((day, i) => {
    const btn = document.createElement('button');
    const d = new Date(day.date + 'T00:00:00');
    const label = d.toLocaleDateString('uk-UA', { weekday: 'short', day: 'numeric', month: 'short' });
    btn.textContent = label;
    if (i === activeDayIndex) btn.classList.add('active');
    btn.onclick = () => { activeDayIndex = i; render(); };
    toggle.appendChild(btn);
  });
}

function render() {
  document.getElementById('generatedMeta').textContent = formatGeneratedAt(scheduleData.generated_at);
  renderDayToggle();

  const day = scheduleData.days[activeDayIndex];
  const isToday = day.date === new Date().toISOString().slice(0, 10);
  const nowMinutes = new Date().getHours() * 60 + new Date().getMinutes();

  const app = document.getElementById('app');
  app.innerHTML = '';

  function sortByTime(trains) {
    return [...trains].sort((a, b) => {
      const ta = parseTime(a.departure ?? a.arrival) ?? 9999;
      const tb = parseTime(b.departure ?? b.arrival) ?? 9999;
      return ta - tb;
    });
  }

  function renderRows(container, trains) {
    const nextIndex = isToday
      ? trains.findIndex(t => (parseTime(t.departure ?? t.arrival) ?? -1) >= nowMinutes)
      : -1;

    trains.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (i === nextIndex ? ' next' : '');
      const time = t.departure ?? t.arrival ?? '—';
      row.innerHTML = `
        <div class="time">${time}</div>
        <div class="route"><span class="num">${t.number}</span>${t.route}</div>
      `;
      container.appendChild(row);
    });
  }

  Object.entries(day.stations).forEach(([stationName, stationData]) => {
    const groups = stationData.groups ?? [];
    const totalTrains = groups.reduce((sum, g) => sum + g.trains.length, 0);

    const section = document.createElement('div');
    section.className = 'station';

    const head = document.createElement('div');
    head.className = 'station-head';
    head.innerHTML = `<h2>${stationName}</h2><span class="note">${totalTrains} рейсів</span>`;
    section.appendChild(head);

    if (totalTrains === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Немає рейсів на цю дату.';
      section.appendChild(empty);
    } else {
      groups.forEach(g => {
        const group = document.createElement('div');
        group.className = 'direction-group';
        group.innerHTML = `<div class="direction-label">${g.label}</div>`;
        renderRows(group, sortByTime(g.trains));
        section.appendChild(group);
      });
    }

    app.appendChild(section);
  });
}

fetch(DATA_URL)
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    scheduleData = data;
    render();
  })
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<div class="error">Не вдалося завантажити дані (${err.message}). Перевір, чи запускався скрипт оновлення.</div>`;
  });
</script>

</body>
</html>
